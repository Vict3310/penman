<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Penman Empire">
  <title>Penman Empire</title>
  <!-- Forest tile with the 3x3 dot cluster used throughout the site -->
  <rect width="64" height="64" rx="14" fill="#1E4D33"/>
  <g fill="#FFFFFF">
    <!-- corners carry the leaf accent -->
    <circle cx="19" cy="19" r="4.6" fill="#42A85D"/>
    <circle cx="32" cy="19" r="4.6" fill-opacity="0.92"/>
    <circle cx="45" cy="19" r="4.6" fill-opacity="0.45"/>
    <circle cx="19" cy="32" r="4.6" fill-opacity="0.92"/>
    <circle cx="32" cy="32" r="4.6" fill-opacity="0.45"/>
    <circle cx="45" cy="32" r="4.6" fill-opacity="0.92"/>
    <circle cx="19" cy="45" r="4.6" fill-opacity="0.45"/>
    <circle cx="32" cy="45" r="4.6" fill-opacity="0.92"/>
    <circle cx="45" cy="45" r="4.6" fill="#42A85D"/>
  </g>
</svg>
